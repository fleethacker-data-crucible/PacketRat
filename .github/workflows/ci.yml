name: PacketRat checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read

jobs:
  browser-and-source:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and rendering
        run: |
          $ErrorActionPreference='Stop'
          node --check Web/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check Web/report-experience.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/test_intelligence.js
          node tests/test_voice.js
          node tests/test_voice_input.js
          node tests/test_voice_piper.js
          node tests/test_gen_icons.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install development browser dependencies
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check pillow playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Static and browser smoke tests
        run: |
          $ErrorActionPreference='Stop'
          python tests/test_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_frontend.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_launcher_contract.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  powershell-51:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Windows PowerShell files
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { throw ("Parser errors in "+$_.FullName+": "+(($errors | ForEach-Object { $_.Message }) -join '; ')) }
          }
      - name: Offline triage and draft tests
        run: |
          .\tests\Test-PacketRatTriage.ps1
          .\tests\Test-PacketRatFleetInventory.ps1
          .\tests\Test-PacketRatReport.ps1
          .\tests\Test-PacketRatProtocol.ps1
          .\tests\Test-PacketRatLifecycle.ps1
          .\tests\Test-PacketRatDataDir.ps1
          .\tests\Test-PacketRatCommands.ps1
          .\tests\Test-PacketRatAuthority.ps1
          .\tests\Test-PacketRatClassify.ps1
          .\tests\Test-PacketRatFairlead.ps1
          .\tests\Test-PacketRatFairleadDefault.ps1
          .\tests\Test-PacketRatStreaming.ps1
          .\tests\Test-PacketRatGraph.ps1
          .\tests\Test-PacketRatInboxActions.ps1
          .\tests\Test-PacketRatHandoff.ps1
          .\tests\Test-PacketRatMailFiles.ps1
          .\tests\Test-PacketRatUsage.ps1
          .\tests\Test-PacketRatDataSources.ps1
          .\tests\Test-PacketRatActionLog.ps1
          .\tests\Test-PacketRatRouter.ps1
          .\tests\Test-PacketRatAssistant.ps1
          .\tests\Test-PacketRatVoiceAssets.ps1
          .\tests\Test-PacketRatBurden.ps1
