name: PacketRat checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read

jobs:
  browser-and-source:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and rendering
        run: |
          node --check Web/app.js
          node --check Web/report-experience.js
          node tests/test_intelligence.js
      - name: Install development browser dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow playwright
          python -m playwright install --with-deps chromium
      - name: Static and browser smoke tests
        run: |
          python tests/test_contract.py
          python tests/test_frontend.py
          python -m unittest discover -s tests -p 'test_launcher_contract.py'

  powershell-51:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Windows PowerShell files
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { throw ("Parser errors in "+$_.FullName+": "+(($errors | ForEach-Object { $_.Message }) -join '; ')) }
          }
      - name: Offline triage and draft tests
        run: |
          .\tests\Test-PacketRatTriage.ps1
          .\tests\Test-PacketRatReport.ps1
          .\tests\Test-PacketRatProtocol.ps1
          .\tests\Test-PacketRatLifecycle.ps1
