name: MailHawk checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read

jobs:
  browser-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check JavaScript syntax and rendering
        run: |
          node --check Web/app.js
          node tests/test_intelligence.js
      - name: Install development browser dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow playwright
          python -m playwright install --with-deps chromium
      - name: Static and browser smoke tests
        run: |
          python tests/test_contract.py
          python tests/test_frontend.py
          python -m unittest discover -s tests -p 'test_launcher_contract.py'

  powershell-51:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Windows PowerShell files
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { throw ("Parser errors in "+$_.FullName+": "+($errors|ForEach-Object Message -Join '; ')) }
          }
      - name: Offline triage and draft tests
        run: .\tests\Test-MailHawkTriage.ps1
